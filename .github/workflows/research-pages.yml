name: Publish MSBF research

on:
  pull_request:
    paths:
      - README.md
      - docs/research-publication/RELEASE.md
      - research-site/**
      - tools/check_pages.py
      - tools/register_research_reports.py
      - tools/render_research_guides.py
      - .github/workflows/research-pages.yml
  push:
    branches: ['**']
    paths:
      - README.md
      - docs/research-publication/RELEASE.md
      - research-site/**
      - tools/check_pages.py
      - tools/register_research_reports.py
      - tools/render_research_guides.py
      - .github/workflows/research-pages.yml
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Check research and repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reconcile the five cohort exhibits
        run: python3 -B research-site/evidence/verify_studies.py
      - name: Compare repository table with cohort evidence
        run: python3 -B research-site/evidence/check_readme_table.py
      - name: Match the web guides to their Markdown sources
        run: python3 -B tools/render_research_guides.py --check
      - name: Check Pages links and report catalog
        run: python3 -B tools/check_pages.py
      - name: Verify repository inventory before publishing
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: python3 -B tools/validate_public_release.py
      - name: Package the research site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: research-site/

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: msbf-research-pages
      cancel-in-progress: false
    steps:
      - name: Publish verified artifact
        uses: actions/deploy-pages@v4

  release-notes:
    name: Update the research release description
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'andrew-goad/merchant-sales-based-financing-strategy-simulator'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: msbf-research-release-notes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Sync the November release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=msbf-research-assets-2026-11
          notes=docs/research-publication/RELEASE.md
          releases="repos/$GITHUB_REPOSITORY/releases"
          record="$RUNNER_TEMP/msbf-release.json"
          gh api "$releases/tags/$tag" > "$record"
          id=$(jq -er --arg tag "$tag" 'select(.tag_name == $tag and .draft == false) | .id' "$record")
          if jq -e --rawfile notes "$notes" '.body == $notes' "$record" > /dev/null; then
            echo "The release description already matches."
            exit 0
          fi
          jq -Rs '{body: .}' "$notes" | gh api --method PATCH "$releases/$id" --input - > "$record"
          jq -e --rawfile notes "$notes" '.body == $notes' "$record" > /dev/null
