<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows experiment · When repayment follows sales</title>
<script>
(() => {
  const aliases = new Map([['750','750a'],['750a','750a'],['take4','750b'],['750b','750b'],['aws750','750c'],['750c','750c'],['2500','2500'],['25000','25000']]);
  const steps = new Set(['install','launch','parameters','counteroffer','trend','tableau','power-bi','gui']);
  const query = new URLSearchParams(location.search);
  const parts = location.hash.slice(1).toLowerCase().split('/');
  const route = aliases.get(parts[0]) || aliases.get((query.get('study') || query.get('cohort') || '').toLowerCase()) || '750b';
  let step = parts[parts.length-1].replace(/-title$/,'');
  if (!steps.has(step)) step = '';
  if (route === '750c' && step === 'counteroffer') step = 'trend';
  if (route !== '750c' && step === 'trend') step = 'counteroffer';
  const target = new URL('index.html',location.href);
  target.hash = route + (step === 'gui' ? '/gui' : '/experiment' + (step ? '/' + step : ''));
  location.replace(target);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=index.html#750b/experiment"></noscript>
</head><body><p><a href="index.html#750b/experiment">Open the Windows experiment in the paper.</a></p></body></html>
